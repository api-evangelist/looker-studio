name: Looker Studio
description: >-
  Looker Studio (formerly Google Data Studio) is a free tool that turns your data into informative, easy to read, easy
  to share, and fully customizable dashboards and reports. The API allows developers to programmatically manage assets,
  build custom connectors and visualizations, embed reports, and automate workflows.
