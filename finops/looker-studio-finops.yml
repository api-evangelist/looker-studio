reconciled: true
description: 'FOCUS-aligned FinOps for Looker Studio: free per-user usage plus a $10/user/month Pro tier.
  Cost is dominated by per-seat Pro licenses; connector and underlying data-source costs (BigQuery,
  Sheets, third-party APIs) accrue separately.'
sources:
  - https://cloud.google.com/looker-studio
  - https://cloud.google.com/looker/pricing
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Google LLC
serviceCategory: Business Intelligence
billingModel:
  pricingCategory: Per-Seat Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Looker Studio
  ServiceCategory: Business Intelligence
  ProviderName: Google Cloud
  PublisherName: Google LLC
  InvoiceIssuerName: Google LLC
  BillingCurrency: USD
meters:
  - name: pro_seats
    unit: seat
    aggregation: max
  - name: free_users
    unit: seat
    aggregation: max
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
principles:
  - name: Visibility
    description: Inventory Pro seats via the Looker Studio admin console; track underlying data source
      query volume in BigQuery / connector logs.
  - name: Allocation
    description: Map Pro seats to Cloud Identity groups for chargeback; tag reports by team/department.
  - name: Optimization
    description: Use the free tier for ad-hoc analysts; reserve Pro seats for users that need team
      workspaces and managed support; cache report queries to lower upstream BigQuery cost.
  - name: Accountability
    description: Owners review Pro seat utilization quarterly; reclaim inactive seats to control monthly burn.
