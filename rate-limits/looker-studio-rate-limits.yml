specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Looker Studio
providerId: looker-studio
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Business Intelligence
  - Google
description: Looker Studio (datastudio.googleapis.com) is governed by Google Cloud per-project / per-user
  quotas managed through the Cloud Quotas page rather than a tier-specific RPS table on the pricing page.
  Connector and embedding APIs inherit quotas from the underlying data source service.
sources:
  - https://cloud.google.com/looker-studio
  - https://cloud.google.com/looker-studio/docs/quotas
notes: Public docs do not enumerate per-second numbers in a single table; values vary by Google
  Cloud quota page and underlying data source service. Set reconciled=true once concrete numbers are pulled.
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - name: Looker Studio API requests
    scope: project
    metric: varies
    limit: 'see Google Cloud Quotas console'
  - name: Connector requests
    scope: connector
    metric: varies
    limit: 'inherits underlying data source quota'
  - name: Embed views
    scope: report
    metric: varies
    limit: 'subject to Google Workspace / Cloud account fair use'
policies:
  - name: Cloud Quotas
    description: Project-level quotas for the Looker Studio API are managed through the Google Cloud
      Quotas console; raise via support.
  - name: Connector inheritance
    description: Community Connectors and the Linking API inherit upstream data source rate limits
      (BigQuery, Sheets, third-party APIs).
  - name: Backoff
    description: On 429 / 503, retry with exponential backoff and respect Retry-After when present.
