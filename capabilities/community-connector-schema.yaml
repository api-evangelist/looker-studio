naftiko: 1.0.0-alpha2
info:
  label: Looker Studio Community Connector API — Schema
  description: 'Looker Studio Community Connector API — Schema. 1 operations. Lead operation: Looker Studio Get data schema.
    Self-contained Naftiko capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Schema
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: community-connector-schema
    baseUri: https://datastudio.google.com/datasources/create
    description: Looker Studio Community Connector API — Schema business capability. Self-contained, no shared references.
    resources:
    - name: connector-getSchema
      path: /connector/getSchema
      operations:
      - name: getschema
        method: POST
        description: Looker Studio Get data schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: community-connector-schema-rest
    port: 8080
    description: REST adapter for Looker Studio Community Connector API — Schema. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connector/getschema
      name: connector-getschema
      description: REST surface for connector-getSchema.
      operations:
      - method: POST
        name: getschema
        description: Looker Studio Get data schema
        call: community-connector-schema.getschema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: community-connector-schema-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio Community Connector API — Schema. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: looker-studio-get-data-schema
      description: Looker Studio Get data schema
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: community-connector-schema.getschema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
