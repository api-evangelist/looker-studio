naftiko: 1.0.0-alpha2
info:
  label: Looker Studio Community Connector API — Configuration
  description: 'Looker Studio Community Connector API — Configuration. 1 operations. Lead operation: Looker Studio Get connector
    configuration options. Self-contained Naftiko capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: community-connector-configuration
    baseUri: https://datastudio.google.com/datasources/create
    description: Looker Studio Community Connector API — Configuration business capability. Self-contained, no shared references.
    resources:
    - name: connector-getConfig
      path: /connector/getConfig
      operations:
      - name: getconfig
        method: POST
        description: Looker Studio Get connector configuration options
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: community-connector-configuration-rest
    port: 8080
    description: REST adapter for Looker Studio Community Connector API — Configuration. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/connector/getconfig
      name: connector-getconfig
      description: REST surface for connector-getConfig.
      operations:
      - method: POST
        name: getconfig
        description: Looker Studio Get connector configuration options
        call: community-connector-configuration.getconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: community-connector-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio Community Connector API — Configuration. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: looker-studio-get-connector-configuration
      description: Looker Studio Get connector configuration options
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: community-connector-configuration.getconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
