naftiko: 1.0.0-alpha2
info:
  label: Looker Studio Community Visualization API — Visualization
  description: 'Looker Studio Community Visualization API — Visualization. 2 operations. Lead operation: Looker Studio List
    community visualizations. Self-contained Naftiko capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Visualization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: community-visualization-visualization
    baseUri: https://lookerstudio.google.com
    description: Looker Studio Community Visualization API — Visualization business capability. Self-contained, no shared
      references.
    resources:
    - name: visualization
      path: /visualization
      operations:
      - name: listcommunityvisualizations
        method: GET
        description: Looker Studio List community visualizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: visualization-load
      path: /visualization/load
      operations:
      - name: loadvisualization
        method: POST
        description: Looker Studio Load a community visualization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: community-visualization-visualization-rest
    port: 8080
    description: REST adapter for Looker Studio Community Visualization API — Visualization. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/visualization
      name: visualization
      description: REST surface for visualization.
      operations:
      - method: GET
        name: listcommunityvisualizations
        description: Looker Studio List community visualizations
        call: community-visualization-visualization.listcommunityvisualizations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/visualization/load
      name: visualization-load
      description: REST surface for visualization-load.
      operations:
      - method: POST
        name: loadvisualization
        description: Looker Studio Load a community visualization
        call: community-visualization-visualization.loadvisualization
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: community-visualization-visualization-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio Community Visualization API — Visualization. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: looker-studio-list-community-visualizations
      description: Looker Studio List community visualizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: community-visualization-visualization.listcommunityvisualizations
      outputParameters:
      - type: object
        mapping: $.
    - name: looker-studio-load-community-visualization
      description: Looker Studio Load a community visualization
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: community-visualization-visualization.loadvisualization
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
