naftiko: 1.0.0-alpha2
info:
  label: Looker Studio Community Visualization API — Manifest
  description: 'Looker Studio Community Visualization API — Manifest. 1 operations. Lead operation: Looker Studio Get visualization
    manifest schema. Self-contained Naftiko capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Manifest
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: community-visualization-manifest
    baseUri: https://lookerstudio.google.com
    description: Looker Studio Community Visualization API — Manifest business capability. Self-contained, no shared references.
    resources:
    - name: visualization-manifest
      path: /visualization/manifest
      operations:
      - name: getvisualizationmanifest
        method: GET
        description: Looker Studio Get visualization manifest schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: community-visualization-manifest-rest
    port: 8080
    description: REST adapter for Looker Studio Community Visualization API — Manifest. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/visualization/manifest
      name: visualization-manifest
      description: REST surface for visualization-manifest.
      operations:
      - method: GET
        name: getvisualizationmanifest
        description: Looker Studio Get visualization manifest schema
        call: community-visualization-manifest.getvisualizationmanifest
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: community-visualization-manifest-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio Community Visualization API — Manifest. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: looker-studio-get-visualization-manifest
      description: Looker Studio Get visualization manifest schema
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: community-visualization-manifest.getvisualizationmanifest
      outputParameters:
      - type: object
        mapping: $.
