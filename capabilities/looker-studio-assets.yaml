naftiko: 1.0.0-alpha2
info:
  label: Looker Studio API — Assets
  description: 'Looker Studio API — Assets. 1 operations. Lead operation: Search Looker Studio assets. Self-contained Naftiko
    capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: looker-studio-assets
    baseUri: https://datastudio.googleapis.com/v1
    description: Looker Studio API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: assets:search
      path: /assets:search
      operations:
      - name: searchassets
        method: GET
        description: Search Looker Studio assets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetTypes
          in: query
          type: array
          description: The types of assets to search for. Valid values are REPORT and DATA_SOURCE.
          required: true
        - name: title
          in: query
          type: string
          description: Filter assets by title (partial match).
        - name: includeTrash
          in: query
          type: boolean
          description: Whether to include trashed assets in the results.
        - name: orderBy
          in: query
          type: string
          description: Field to order results by, such as title, createTime, or updateTime.
        - name: pageSize
          in: query
          type: integer
          description: Maximum number of assets to return per page.
        - name: pageToken
          in: query
          type: string
          description: Token for retrieving the next page of results.
    authentication:
      type: bearer
      token: '{{env.LOOKER_STUDIO_API_KEY}}'
  exposes:
  - type: rest
    namespace: looker-studio-assets-rest
    port: 8080
    description: REST adapter for Looker Studio API — Assets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/assets-search
      name: assets-search
      description: REST surface for assets:search.
      operations:
      - method: GET
        name: searchassets
        description: Search Looker Studio assets
        call: looker-studio-assets.searchassets
        with:
          assetTypes: rest.assetTypes
          title: rest.title
          includeTrash: rest.includeTrash
          orderBy: rest.orderBy
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: looker-studio-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio API — Assets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: search-looker-studio-assets
      description: Search Looker Studio assets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: looker-studio-assets.searchassets
      with:
        assetTypes: tools.assetTypes
        title: tools.title
        includeTrash: tools.includeTrash
        orderBy: tools.orderBy
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
