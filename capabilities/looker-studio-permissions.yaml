naftiko: 1.0.0-alpha2
info:
  label: Looker Studio API — Permissions
  description: 'Looker Studio API — Permissions. 4 operations. Lead operation: Looker Studio Get asset permissions. Self-contained
    Naftiko capability covering one Looker Studio business surface.'
  tags:
  - Looker Studio
  - Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOOKER_STUDIO_API_KEY: LOOKER_STUDIO_API_KEY
capability:
