  - type: http
    namespace: looker-studio-permissions
    baseUri: https://datastudio.googleapis.com/v1
    description: Looker Studio API — Permissions business capability. Self-contained, no shared references.
    resources:
    - name: assets-assetId-permissions
      path: /assets/{assetId}/permissions
      operations:
      - name: getassetpermissions
        method: GET
        description: Looker Studio Get asset permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetId
          in: path
          type: string
          description: The unique identifier of the Looker Studio asset.
          required: true
      - name: updateassetpermissions
        method: PATCH
        description: Looker Studio Update asset permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetId
          in: path
          type: string
          description: The unique identifier of the Looker Studio asset.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: assets-assetId-permissions:addMembers
      path: /assets/{assetId}/permissions:addMembers
      operations:
      - name: addassetmembers
        method: POST
        description: Looker Studio Add members to asset permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetId
          in: path
          type: string
          description: The unique identifier of the Looker Studio asset.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: assets-assetId-permissions:revokeAllPermissions
      path: /assets/{assetId}/permissions:revokeAllPermissions
      operations:
      - name: revokeallassetpermissions
        method: POST
        description: Looker Studio Revoke all permissions for members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetId
          in: path
          type: string
          description: The unique identifier of the Looker Studio asset.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LOOKER_STUDIO_API_KEY}}'
  exposes:
  - type: rest
    namespace: looker-studio-permissions-rest
    port: 8080
    description: REST adapter for Looker Studio API — Permissions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/assets/{assetid}/permissions
      name: assets-assetid-permissions
      description: REST surface for assets-assetId-permissions.
      operations:
      - method: GET
        name: getassetpermissions
        description: Looker Studio Get asset permissions
        call: looker-studio-permissions.getassetpermissions
        with:
          assetId: rest.assetId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateassetpermissions
        description: Looker Studio Update asset permissions
        call: looker-studio-permissions.updateassetpermissions
        with:
          assetId: rest.assetId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{assetid}/permissions-addmembers
      name: assets-assetid-permissions-addmembers
      description: REST surface for assets-assetId-permissions:addMembers.
      operations:
      - method: POST
        name: addassetmembers
        description: Looker Studio Add members to asset permissions
        call: looker-studio-permissions.addassetmembers
        with:
          assetId: rest.assetId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{assetid}/permissions-revokeallpermissions
      name: assets-assetid-permissions-revokeallpermissions
      description: REST surface for assets-assetId-permissions:revokeAllPermissions.
      operations:
      - method: POST
        name: revokeallassetpermissions
        description: Looker Studio Revoke all permissions for members
        call: looker-studio-permissions.revokeallassetpermissions
        with:
          assetId: rest.assetId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: looker-studio-permissions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Looker Studio API — Permissions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: looker-studio-get-asset-permissions
      description: Looker Studio Get asset permissions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: looker-studio-permissions.getassetpermissions
      with:
        assetId: tools.assetId
      outputParameters:
      - type: object
        mapping: $.
    - name: looker-studio-update-asset-permissions
      description: Looker Studio Update asset permissions
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: looker-studio-permissions.updateassetpermissions
      with:
        assetId: tools.assetId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: looker-studio-add-members-asset
      description: Looker Studio Add members to asset permissions
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: looker-studio-permissions.addassetmembers
      with:
        assetId: tools.assetId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: looker-studio-revoke-all-permissions
      description: Looker Studio Revoke all permissions for members
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: looker-studio-permissions.revokeallassetpermissions
      with:
        assetId: tools.assetId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
