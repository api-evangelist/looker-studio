description: Looker Studio is offered in two tiers — a free version available to all users and Looker
  Studio Pro at $10/month per user. Pro adds enterprise team collaboration, Cloud Identity / Workspace
  integration, and access to managed support.
sources:
  - https://cloud.google.com/looker-studio
  - https://cloud.google.com/looker/pricing
plans:
  - id: looker-studio-free
    name: Looker Studio (Free)
    type: freemium
    description: Free for all users. Build dashboards and reports against Google and 3rd-party data sources.
    entries:
      - label: Per-user license
        name: free_user
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: Dashboards and reports
      - name: Sharing
      - name: Community connectors
      - name: Community visualizations
  - id: looker-studio-pro
    name: Looker Studio Pro
    type: subscription
    description: $10/month per user. Adds enterprise team workspaces, managed support, and integration with Cloud Identity / Workspace.
    entries:
      - label: Per-user license
        name: pro_user
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '10.00'
        userMultiplied: true
    elements:
      - name: Team workspaces
      - name: Managed Google Cloud support
      - name: Cloud Identity / Workspace integration
      - name: Enterprise asset management
